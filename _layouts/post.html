---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      {% if page.avatar %}
      <img src="{{ page.avatar }}" alt="">
      {% endif %}
      <span>by {{ page.author | default: site.author.name }}</span>
      <span>·</span>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.postFooter %}
  <p class="post-footer-note">{{ page.postFooter }}</p>
  {% endif %}

  <p class="back-home"><a href="/blog">← All posts</a></p>
</article>
