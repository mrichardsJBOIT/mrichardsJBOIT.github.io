---
layout: default
title: Gallery
description: A small gallery of photos
---

<section class="section">
  <div class="container">
    <h2>Gallery</h2>
    <p class="section-sub">A few photos. More coming as I get around to it.</p>
  </div>
</section>

<div class="gallery-wrap">
  <div class="gallery-grid" id="gallery-grid">
    {% for photo in site.data.gallery %}
    <figure data-large="{{ photo.large }}">
      <img src="{{ photo.small }}" alt="{{ photo.alt }}" loading="lazy">
      <figcaption><strong>{{ photo.title }}</strong>{{ photo.description }}</figcaption>
    </figure>
    {% endfor %}
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" aria-label="Close">×</button>
  <img class="lightbox-img" src="" alt="">
  <p class="lightbox-caption"></p>
</div>
