<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  {% if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  {% else %}
  <meta name="description" content="{{ site.description | escape }}">
  {% endif %}
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% feed_meta %}
  {% seo %}

  <!-- Fonts: Fraunces (display serif) + Sora (humanist sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,400&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome (CDN, no vendored copy) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/site.js" defer></script>
</head>
