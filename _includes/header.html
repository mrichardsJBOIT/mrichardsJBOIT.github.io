<header class="site-header">
  <a class="site-logo" href="/" aria-label="Gr8ful Dev home">
    <span class="logo-mark">G</span>
    <span class="logo-text">Gr8ful&nbsp;Dev</span>
  </a>
  <button class="nav-toggle" id="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle menu">
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>
  <nav class="site-nav" id="site-nav" aria-label="Main">
    <ul>
      <li{% if page.url == "/" %} class="active"{% endif %}><a href="/">Home</a></li>
      <li{% if page.url contains "/projects" %} class="active"{% endif %}><a href="/projects">Projects</a></li>
      <li{% if page.url contains "/blog" or page.url contains "/20" %} class="active"{% endif %}><a href="/blog">Blog</a></li>
      <li><a href="{{ site.author.business }}" rel="me">TR Solutions</a></li>
      <li{% if page.url contains "/contact" %} class="active"{% endif %}><a href="/contact">Contact</a></li>
    </ul>
  </nav>
</header>
